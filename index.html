<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seagull</title>
  
    <script type="module" src="https://cdn.jsdelivr.net/npm/@babylonjs/viewer/dist/babylon-viewer.esm.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; 
            background-color: #b6b8b6;
        }

        babylon-viewer {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border: none; 
        }
    </style>
</head>
<body>
    <babylon-viewer 
        source="https://lukeharris3d.github.io/seagull/seagull.glb"
        environment-lighting="https://lukeharris3d.github.io/seagull/church_exterior_2k.hdr"
        environment-skybox="https://lukeharris3d.github.io/seagull/church_exterior_2k.hdr"
        skybox-blur="0.7"
        skybox-rotation="4.97"
        skybox-intensity="0.8"
        shadow-quality="normal"
        tone-mapping="aces"
        exposure="1.2"
        ssao="enabled"
        camera-orbit="0.880 1.128 10.229"
        camera-target="-0.187 1.352 -0.094"
        camera-auto-orbit
    >
    </babylon-viewer>
</body>
</html>
